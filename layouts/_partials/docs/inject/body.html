<style>
/* Code block container */
.copy-code-container {
  position: relative !important;
}

/* Copy button */
.copy-code-container > .copy-code-btn {
  position: absolute !important;
  top: 10px !important;
  right: 10px !important;
  z-index: 10;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: auto;
  min-width: 48px;
  height: 28px;
  margin: 0;
  padding: 4px 10px;

  font-family: inherit;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  white-space: nowrap;

  color: #c8d3f5;
  background: #3b4261;
  border: 1px solid #545c7e;
  border-radius: 4px;
  box-shadow: none;

  cursor: pointer;

  /* Hide the button by default */
  opacity: 0;
  visibility: hidden;

  transition:
    opacity 0.2s ease,
    visibility 0.2s ease,
    background-color 0.2s ease;
}

/* Show the button when hovering over the code block */
.copy-code-container:hover > .copy-code-btn,
.copy-code-container > .copy-code-btn:focus-visible {
  opacity: 1;
  visibility: visible;
}

/* Button hover effect */
.copy-code-container > .copy-code-btn:hover {
  color: #ffffff;
  background: #545c7e;
}

/* Keyboard focus indicator */
.copy-code-container > .copy-code-btn:focus-visible {
  outline: 2px solid #82aaff;
  outline-offset: 2px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {

  /**
   * Extract code text without Chroma line numbers.
   */
  function getCodeText(codeElement) {
    const clone = codeElement.cloneNode(true);

    // Remove line numbers generated with CSS classes
    clone.querySelectorAll('.ln, .lnt').forEach(element => {
      element.remove();
    });

    // Remove inline-styled line numbers generated by Chroma
    clone.querySelectorAll(
      '[style*="user-select:none"], ' +
      '[style*="user-select: none"]'
    ).forEach(element => {
      element.remove();
    });

    // Preserve original whitespace and line breaks
    return clone.textContent;
  }

  /**
   * Copy text to the clipboard.
   */
  async function copyToClipboard(text) {
    // Use the modern Clipboard API when available
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }

    // Fallback for older browsers
    const textarea = document.createElement('textarea');

    textarea.value = text;
    textarea.setAttribute('readonly', '');

    textarea.style.position = 'fixed';
    textarea.style.top = '0';
    textarea.style.left = '-9999px';
    textarea.style.opacity = '0';

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();

    try {
      const success = document.execCommand('copy');

      if (!success) {
        throw new Error('Clipboard copy failed');
      }
    } finally {
      textarea.remove();
    }
  }

  /**
   * Initialize copy buttons for all code blocks.
   */
  function initializeCopyButtons() {
    const codeBlocks = document.querySelectorAll('pre');

    codeBlocks.forEach(pre => {
      // Find the Chroma highlight container
      let container = pre.closest('.highlight') || pre;

      // Prevent duplicate copy buttons
      if (container.dataset.copyReady === 'true') {
        return;
      }

      // Find the actual code element
      const code = pre.querySelector('code');

      if (!code) {
        return;
      }

      // Mark the container as initialized
      container.dataset.copyReady = 'true';

      // Wrap plain code blocks in a positioned container
      if (container === pre) {
        const wrapper = document.createElement('div');

        wrapper.className = 'copy-code-container';

        pre.replaceWith(wrapper);
        wrapper.appendChild(pre);

        container = wrapper;
      } else {
        // Use the existing Chroma container
        container.classList.add('copy-code-container');
      }

      // Create the copy button
      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'copy-code-btn';
      button.textContent = 'Copy';
      button.setAttribute('aria-label', 'Copy code');
      button.setAttribute('title', 'Copy code');

      let resetTimer;

      // Handle copy button clicks
      button.addEventListener('click', async () => {
        const text = getCodeText(code);

        try {
          await copyToClipboard(text);

          button.textContent = 'Copied!';
          button.setAttribute('aria-label', 'Code copied');
        } catch (error) {
          button.textContent = 'Failed';
          button.setAttribute('aria-label', 'Copy failed');

          console.error('Failed to copy code:', error);
        }

        // Reset the button state
        clearTimeout(resetTimer);

        resetTimer = setTimeout(() => {
          button.textContent = 'Copy';
          button.setAttribute('aria-label', 'Copy code');
        }, 2000);
      });

      // Insert the button into the code block container
      container.appendChild(button);
    });
  }

  // Initialize all code blocks
  initializeCopyButtons();

});
</script>
